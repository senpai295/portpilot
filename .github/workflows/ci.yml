name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verify Dependencies
        shell: bash
        run: |
          if [ -f go.mod ] && [ -s go.mod ]; then
            go mod tidy
            # Fail if tidy changed go.mod or go.sum, so committed files stay in sync.
            git diff --exit-code -- go.mod go.sum
          else
            echo "no go.mod or go.mod is empty; skipping module tidy"
          fi

      - name: Check Formatting (gofmt)
        shell: bash
        run: |
          unformatted=$(gofmt -s -l ./internal ./cmd/portpilot)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Static Analysis (go vet)
        run: go vet ./internal/... ./cmd/portpilot/...

      - name: Run Tests (with race detector)
        if: runner.os != 'Windows'
        run: go test -v -race ./internal/... ./cmd/portpilot/...

      - name: Run Tests
        if: runner.os == 'Windows'
        run: go test -v ./internal/... ./cmd/portpilot/...